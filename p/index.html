<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pick your dates · The Mahj Report</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6EFE1">
<meta property="og:title" content="Which nights can you play?">
<meta property="og:description" content="Tap the dates that work for you. Takes ten seconds, no account needed.">

<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<style>
:root{
  --sage:#8A9A6B; --sage-deep:#5E7046; --sage-pale:#EEF7EC;
  --cream:#F6EFE1; --panel:#FEFDF9;
  --teal:#1E6F7A; --clay:#C25A2B; --bark:#37372B;
  --muted:#7E8468; --line:rgba(55,55,43,.14);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--cream); color:var(--bark);
  padding:26px 18px calc(40px + env(safe-area-inset-bottom));
  line-height:1.5;
}
.wrap{max-width:560px;margin:0 auto}

.brand{display:flex;align-items:center;gap:9px;margin-bottom:22px}
.brand svg{width:26px;height:33px;display:block}
.brand .kick{font-size:11px;letter-spacing:.19em;font-weight:700;color:var(--teal)}

h1{font-family:'Playfair Display',Georgia,serif;font-size:29px;line-height:1.15;font-weight:600;color:var(--sage-deep);letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14.5px;margin-top:8px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:22px}

label.fieldlab{display:block;font-size:11.5px;letter-spacing:.15em;font-weight:700;color:var(--teal);margin-bottom:8px}
input[type=text]{
  width:100%;font:inherit;font-size:17px;padding:13px 14px;
  border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--bark)
}
input[type=text]:focus{outline:none;border-color:var(--teal)}

.opt{border:1px solid var(--line);border-radius:13px;padding:14px;margin-top:12px;background:var(--panel);transition:border-color .15s,background .15s}
.opt.picked{border-color:var(--sage-deep);background:var(--sage-pale)}
.opt .day{font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:600}
.opt .time{color:var(--muted);font-size:14px;margin-top:2px}
.place{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08)}
.place .where{font-weight:600;font-size:15px}
.place .addr{display:inline-block;margin-top:2px;color:var(--sage-deep);font-size:14px;text-decoration:underline;text-underline-offset:2px}
.note{margin-top:14px;padding:14px 16px;border-radius:14px;background:var(--sage-pale);border:1px solid rgba(0,0,0,.07)}
.note-label{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.note-body{font-size:15px;line-height:1.5;white-space:pre-wrap}
.settled{background:var(--sage-pale)}
.settled-line{margin:0;font-size:16px;line-height:1.45}
.settled-sub{margin:8px 0 0;font-size:13.5px;line-height:1.45;color:var(--muted)}
.rsvp-note{margin:0 0 8px 12px;font-size:13.5px;line-height:1.4;color:var(--muted)}
.flash{display:flex;align-items:center;gap:10px;margin-top:18px;padding:13px 16px;border-radius:14px;
  background:var(--sage-deep);color:#F6EFE1;font-size:15px;font-weight:600;line-height:1.35}
.flash-tick{font-size:18px;font-weight:700;flex:0 0 auto}

.who{display:flex;flex-wrap:wrap;gap:8px}
.who button{
  font:inherit;font-size:15px;font-weight:600;padding:10px 14px;
  border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--bark);cursor:pointer
}
.who button[aria-pressed="true"]{background:var(--sage-deep);border-color:transparent;color:#fff}
.who button.other[aria-pressed="true"]{background:var(--teal)}
.choices{display:flex;gap:8px;margin-top:12px}
.choices button{
  flex:1;font:inherit;font-size:14.5px;font-weight:600;padding:11px 6px;
  border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--muted);cursor:pointer
}
.choices button[aria-pressed="true"]{color:#fff;border-color:transparent}
.choices button.yes[aria-pressed="true"]{background:var(--sage-deep)}
.choices button.maybe[aria-pressed="true"]{background:var(--clay)}
.choices button.no[aria-pressed="true"]{background:#8A8F79}

button.send{
  width:100%;font:inherit;font-size:17px;font-weight:700;color:#fff;background:var(--teal);
  border:none;border-radius:12px;padding:16px;margin-top:22px;cursor:pointer
}
button.send:disabled{opacity:.45;cursor:default}

.note{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.err{background:#FBEAE5;border:1px solid #E3B4A4;color:#9B3B18;border-radius:11px;padding:12px 14px;margin-top:16px;font-size:14.5px}

table.tally{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
table.tally th,table.tally td{padding:9px 6px;text-align:center;border-bottom:1px solid var(--line)}
table.tally th:first-child,table.tally td:first-child{text-align:left;font-weight:600}
table.tally thead th{font-size:11.5px;letter-spacing:.06em;color:var(--teal);font-weight:700}
table.tally tr.leader td{background:var(--sage-pale)}
.mark{font-size:16px}
.mark.y{color:var(--sage-deep)}
.mark.m{color:var(--clay)}
.mark.n{color:#C9CBBC}

.foot{text-align:center;margin-top:30px;font-size:13px;color:var(--muted)}
.foot a{color:var(--teal);text-decoration:none;font-weight:600}
.skel{height:76px;border-radius:13px;background:rgba(55,55,43,.05);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <!-- Tile face is --panel, not --cream: the page background IS --cream, so a
         cream face made the tile vanish and left a floating M. -->
    <svg viewBox="0 0 120 150" aria-label="The Mahj Report">
      <rect x="20.8" y="17.6" width="84" height="106" rx="15" fill="#6E8355"/>
      <rect x="18" y="14" width="84" height="106" rx="15" fill="#FEFDF9"/>
      <text x="60" y="101.82" text-anchor="middle" font-family="'Playfair Display',Georgia,serif" font-weight="600" font-size="52" fill="#1E6F7A">M</text>
      <g transform="translate(60,44.475) rotate(-9)">
        <path d="M -18.137 10.375 L -18.137 -5.317 L -8.082 3.527 L 0.502 -13.263 L 9.196 3.740 L 19.033 -4.911 L 19.033 10.375 L 16.189 10.375 L 16.189 -1.008 L 7.488 6.645 L -0.502 -8.982 L -8.602 6.858 L -17.084 -0.602 L -17.084 10.375 Z" fill="#1E6F7A"/>
        <rect x="-18.137" y="10.006" width="37.170" height="1.896" fill="#1E6F7A"/>
      </g>
    </svg>
    <span class="kick">THE MAHJ REPORT</span>
  </div>

  <div id="app">
    <h1>Loading…</h1>
    <div class="skel"></div><div class="skel"></div>
  </div>

  <div class="foot">
    Keeping score on paper works. Keeping a whole season does not.<br>
    <a href="/">themahjreport.com</a>
  </div>
</div>

<script>
const SUPA_URL = "https://us.catdoes.cloud/0dbfd798-fb75-4126-a4f1-dfa71be1db9d";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InltbW9yZmt3Ymx3d2FodG1wcnh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NDEwMzYsImV4cCI6MjEwMTUxNzAzNn0.8WZWgdxaWf_J8s5lSFhdHAVEXcZblcta26PqNyPUzkw";

const H = { apikey: SUPA_KEY, Authorization: "Bearer " + SUPA_KEY, "Content-Type": "application/json" };
const app = document.getElementById("app");

// /p/<uuid>  or  /p/?id=<uuid>
const pollId = (location.pathname.split("/").filter(Boolean).pop() || "").match(/^[0-9a-f-]{36}$/i)
  ? location.pathname.split("/").filter(Boolean).pop()
  : new URLSearchParams(location.search).get("id");

// One browser can log more than one person's response (the host answering for
// herself, then logging a friend's answer too, from the same phone). So this
// is a small list of everything THIS browser has submitted for THIS poll, not
// a single slot. The old single-slot key is migrated into this on first load
// and then removed, see migrateOldToken().
const savedKey = "mahj_poll_saved_" + pollId;
const oldTokenKey = "mahj_poll_token_" + pollId;
const nameKey  = "mahj_poll_name";

const api = (path) => fetch(SUPA_URL + "/rest/v1/" + path, { headers: H }).then(r => r.json());
const rpc = (fn, body) =>
  fetch(SUPA_URL + "/rest/v1/rpc/" + fn, { method: "POST", headers: H, body: JSON.stringify(body) })
    .then(async (r) => {
      const out = await r.json();
      if (!r.ok) throw new Error(out.message || out.hint || "Something went wrong.");
      return out;
    });

// A 6pm start is a game night; an 11am start is not. Four o'clock is the line.
const dayWord = (d) => (d.getHours() >= 16 ? "night" : "day");
const fmtDay  = (d) => d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
const fmtTime = (d) => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }).replace(":00", "");
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

let poll, options = [], responses = [], picks = {};
// RSVP half: the same link becomes the invitation once the host picks a night.
let rsvpPick = null, typedName = null;
// Roster names, so an answer can be tied to an actual player instead of being
// free text that only looks like a name we know.
let roster = [], playerId = null, otherMode = false, rerender = () => {};
// Set when somebody who has already answered asks to change it, so the buttons
// come back. Without this they'd be told they're already down and then handed
// the same form anyway, which is what made it feel like answering twice.
let changing = false;
let typedNote = null;
// What the last submission did, so the page can acknowledge it. Cleared as soon
// as the person does anything else, so it reads as a response to their tap
// rather than a permanent banner.
let justSaved = null; // "sent" | "changed" | "confirmed"

// Everything this browser has ever submitted for this poll: [{id, token, name}].
// activeSavedId is which one (if any) is currently loaded into the form. null
// means the form is a fresh, unsent response, so submitting it inserts a new
// row rather than editing whichever response happened to load last.
let savedResponses = [];
let activeSavedId = null;

function loadSaved() {
  try { return JSON.parse(localStorage.getItem(savedKey) || "[]"); } catch (e) { return []; }
}
function persistSaved(list) {
  localStorage.setItem(savedKey, JSON.stringify(list));
}
function addOrUpdateSaved(id, token, name) {
  const list = loadSaved();
  const idx = list.findIndex(s => s.id === id || (token && s.token === token));
  const entry = { id: id || (list[idx] && list[idx].id) || "", token, name };
  if (idx >= 0) list[idx] = entry; else list.push(entry);
  persistSaved(list);
  return list;
}
// One-time migration from the old single-slot key, so nobody's existing
// in-progress response looks like it vanished the day this shipped.
function migrateOldToken() {
  const old = localStorage.getItem(oldTokenKey);
  if (!old) return;
  const [id, token] = old.split("|");
  if (id && token) {
    addOrUpdateSaved(id, token, localStorage.getItem(nameKey) || "");
  }
  localStorage.removeItem(oldTokenKey);
}

// Blank slate: no response loaded, so a submit from here always inserts a new
// row. Used both for a first-time visitor and for "log another response".
function clearForm() {
  picks = {};
  playerId = null;
  otherMode = false;
  typedName = null; // null (not "") lets the name field fall back to the last-used name
  rsvpPick = null;
  typedNote = null;
  changing = false;
  justSaved = null;
  activeSavedId = null;
}

// Loads one specific saved response into the form for editing. This is the
// only place activeSavedId gets set to a real id, so submitting afterward
// edits that exact row instead of guessing which "you" this browser means.
function hydrateFromResponse(respId) {
  clearForm();
  const r = responses.find(x => x.id === respId);
  if (!r) return;
  activeSavedId = respId;
  if (r.player_id) playerId = r.player_id; else otherMode = true;
  typedName = r.respondent_name || "";
  (r.poll_answers || []).forEach(a => { picks[a.option_id] = a.choice; });
  rsvpPick = r.rsvp_status || null;
  typedNote = r.rsvp_note || null;
}


async function load() {
  if (!pollId) return fail("That link looks incomplete.", "Ask whoever sent it to share it again.");
  try {
    const polls = await api(`polls?id=eq.${pollId}&select=id,title,status,chosen_option_id,location,address,notes`);
    if (!polls.length) return fail("This poll has gone.", "It may have been deleted by the host.");
    poll = polls[0];
    options = await api(`poll_options?poll_id=eq.${pollId}&select=id,starts_at,sort_order&order=sort_order.asc,starts_at.asc`);
    await loadResponses();
    try {
      const r = await rpc("poll_roster", { p_poll_id: pollId });
      roster = Array.isArray(r) ? r : [];
    } catch (e) {
      roster = []; // falls back to typing a name
    }
  } catch (e) {
    return fail("Couldn't load the poll.", "Check your connection and pull down to refresh.");
  }
  migrateOldToken();
  savedResponses = loadSaved();
  if (savedResponses.length === 1 && responses.find(r => r.id === savedResponses[0].id)) {
    // Exactly one response from this browser: load it, same as before.
    hydrateFromResponse(savedResponses[0].id);
  } else {
    // Zero, or more than one: start with a blank form rather than guessing
    // which "you" this browser means. When there's more than one, the
    // "logged on this device" list lets the person pick which to edit, or
    // log a new one.
    clearForm();
  }
  render();
}

async function loadResponses() {
  responses = await api(`poll_responses?poll_id=eq.${pollId}&select=id,respondent_name,rsvp_status,rsvp_confirmed_at,rsvp_note,player_id,poll_answers(option_id,choice)&order=created_at.asc`);
}

function whoCard() {
  const saved = typedName !== null ? typedName : (localStorage.getItem(nameKey) || "");
  const showInput = otherMode || roster.length === 0;
  return `
    <div class="card">
      <label class="fieldlab" for="nm">WHO ARE YOU?</label>
      ${roster.length ? `<div class="who">
        ${roster.map(p => `<button class="who-btn" data-pid="${esc(p.player_id)}" aria-pressed="${playerId === p.player_id}">${esc(p.player_name)}</button>`).join("")}
        <button class="who-btn other" data-other="1" aria-pressed="${otherMode}">Someone else</button>
      </div>` : ""}
      <input type="text" id="nm" placeholder="e.g. Kelsey" value="${esc(saved)}" autocomplete="name" enterkeyhint="done"
             style="${showInput ? "margin-top:12px" : "display:none"}">
    </div>`;
}

function wireWho() {
  document.querySelectorAll("[data-pid]").forEach(b => {
    b.onclick = () => {
      const pid = b.dataset.pid;
      if (playerId === pid) {
        clearForm();
        rerender();
        return;
      }
      // If this device has already logged a response for this roster player,
      // load it so editing them doesn't reuse whatever this browser had
      // loaded for someone else, that overwrite is the exact bug this file
      // was rebuilt to avoid. Otherwise start clean, so this becomes a new
      // response for them rather than clobbering anyone else's.
      const existingForPlayer = responses.find(r => r.player_id === pid);
      const savedMatch = existingForPlayer && savedResponses.find(s => s.id === existingForPlayer.id);
      if (savedMatch) {
        hydrateFromResponse(savedMatch.id);
      } else {
        clearForm();
        playerId = pid;
        typedName = (roster.find(r => r.player_id === pid) || {}).player_name || "";
        if (existingForPlayer) rsvpPick = existingForPlayer.rsvp_status || null;
      }
      rerender();
    };
  });
  const other = document.querySelector("[data-other]");
  if (other) other.onclick = () => {
    otherMode = !otherMode;
    if (otherMode) playerId = null;
    rerender();
  };
}

// The "logged on this device" list: everything this browser has submitted for
// this poll, plus a way to log one more. Only shown once there is at least
// one, so a first-time visitor never sees an empty list.
function loggedDeviceCard() {
  if (!savedResponses.length) return "";
  return `
    <div class="card">
      <label class="fieldlab">LOGGED ON THIS DEVICE</label>
      <div class="who">
        ${savedResponses.map(s => `<button class="who-btn" data-saved="${esc(s.id)}" aria-pressed="${activeSavedId === s.id}">${esc(s.name || "Someone")}</button>`).join("")}
        <button class="who-btn other" data-newresp="1" aria-pressed="${activeSavedId === null}">+ Log another</button>
      </div>
      <p class="note" style="text-align:left;margin-top:10px">Tap a name to change what they said, or log another response from this device.</p>
    </div>`;
}

function wireSavedChooser() {
  document.querySelectorAll("[data-saved]").forEach(b => {
    b.onclick = () => {
      hydrateFromResponse(b.dataset.saved);
      rerender();
    };
  });
  const add = document.querySelector("[data-newresp]");
  if (add) add.onclick = () => {
    clearForm();
    rerender();
  };
}

/** Whoever this response belongs to: a tapped roster name, or typed text. */
function currentName() {
  if (playerId) {
    const p = roster.find(r => r.player_id === playerId);
    if (p) return p.player_name;
  }
  const el = document.getElementById("nm");
  return el ? el.value.trim() : "";
}

function fail(title, msg) {
  app.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(msg)}</p>`;
}

function render() {
  if (poll.status !== "open") return renderRsvp();

  const name = localStorage.getItem(nameKey) || "";
  app.innerHTML = `
    <h1>${esc(poll.title || "Which nights can you play?")}</h1>
    <p class="sub">Tap the ones that work for you. No account, no app. This takes ten seconds.</p>

    ${loggedDeviceCard()}

    ${whoCard()}

    <div id="opts">${options.map(optRow).join("")}</div>

    <button class="send" id="send">${activeSavedId ? "Update my dates" : "Send my dates"}</button>
    <p class="note">You can reopen this link any time to change your answer, or log another person's from this device.</p>
    <div id="err"></div>
    ${responses.length ? `<div class="card" style="margin-top:26px"><label class="fieldlab">SO FAR</label>${tallyTable()}</div>` : ""}
  `;

  rerender = render;
  wireWho();
  wireSavedChooser();
  document.getElementById("send").onclick = submit;
  document.querySelectorAll("[data-opt]").forEach(btn => {
    btn.onclick = () => {
      const { opt, choice } = btn.dataset;
      picks[opt] = picks[opt] === choice ? undefined : choice;
      if (!picks[opt]) delete picks[opt];
      refreshOpts();
    };
  });
}

function optRow(o) {
  const d = new Date(o.starts_at);
  const p = picks[o.id];
  return `
    <div class="opt ${p ? "picked" : ""}" id="opt-${o.id}">
      <div class="day">${fmtDay(d)}</div>
      <div class="time">${fmtTime(d)}</div>
      <div class="choices">
        <button class="yes"   data-opt="${o.id}" data-choice="yes"       aria-pressed="${p === "yes"}">Can do</button>
        <button class="maybe" data-opt="${o.id}" data-choice="if_needed" aria-pressed="${p === "if_needed"}">If needed</button>
        <button class="no"    data-opt="${o.id}" data-choice="no"        aria-pressed="${p === "no"}">Can't</button>
      </div>
    </div>`;
}

function refreshOpts() {
  document.getElementById("opts").innerHTML = options.map(optRow).join("");
  document.querySelectorAll("[data-opt]").forEach(btn => {
    btn.onclick = () => {
      const { opt, choice } = btn.dataset;
      picks[opt] = picks[opt] === choice ? undefined : choice;
      if (!picks[opt]) delete picks[opt];
      refreshOpts();
    };
  });
}

function tallyTable(highlightLeader) {
  const counts = options.map(o => {
    let yes = 0, maybe = 0;
    responses.forEach(r => (r.poll_answers || []).forEach(a => {
      if (a.option_id !== o.id) return;
      if (a.choice === "yes") yes++;
      if (a.choice === "if_needed") maybe++;
    }));
    return { o, yes, maybe, score: yes * 2 + maybe };
  });
  const best = Math.max(...counts.map(c => c.score));
  return `
    <table class="tally">
      <thead><tr><th>Who</th>${options.map(o => `<th>${fmtDay(new Date(o.starts_at)).split(",")[0].slice(0,3)}<br>${new Date(o.starts_at).getDate()}</th>`).join("")}</tr></thead>
      <tbody>
        ${responses.map(r => `<tr><td>${esc(r.respondent_name)}</td>${options.map(o => {
          const a = (r.poll_answers || []).find(x => x.option_id === o.id);
          if (a && a.choice === "yes")       return `<td><span class="mark y">✓</span></td>`;
          if (a && a.choice === "if_needed") return `<td><span class="mark m">~</span></td>`;
          return `<td><span class="mark n">·</span></td>`;
        }).join("")}</tr>`).join("")}
        <tr style="font-weight:700">
          <td>Total</td>
          ${counts.map(c => `<td${highlightLeader && c.score === best && best > 0 ? ' style="background:#EEF7EC;color:#5E7046"' : ""}>${c.yes}${c.maybe ? ` <span style="color:#C25A2B;font-weight:600">+${c.maybe}</span>` : ""}</td>`).join("")}
        </tr>
      </tbody>
    </table>
    <p class="note" style="margin-top:10px;text-align:left">✓ can do &nbsp;·&nbsp; ~ if needed</p>`;
}

function renderResults(closed) {
  app.innerHTML = `
    <h1>${closed ? "This poll has closed" : "Thanks, you're in"}</h1>
    <p class="sub">${closed ? "The host has picked a date. Check your messages for the details." : "You can reopen this link any time to change your answer."}</p>
    <div class="card">${tallyTable(true)}</div>
    ${closed ? "" : `
      <button class="send" id="again" style="background:#8A8F79">Change my answer</button>
      <button class="send" id="logAnother" style="background:#fff;color:var(--teal);border:1.5px solid var(--line);margin-top:10px">Log another response from this device</button>
    `}`;
  const again = document.getElementById("again");
  if (again) again.onclick = render;
  const logAnother = document.getElementById("logAnother");
  if (logAnother) logAnother.onclick = () => { clearForm(); render(); };
}

// Which saved response (if any) is currently loaded into the form.
function myResponse() {
  if (!activeSavedId) return null;
  return responses.find(r => r.id === activeSavedId) || null;
}

// Where it is. The address is optional and, when present, becomes a map link.
// "Betsy's" is what you call it, a street address is what a phone can navigate to.
function placeBlock() {
  const name = (poll.location || "").trim();
  const addr = (poll.address || "").trim();
  if (!name && !addr) return "";
  const esc = (t) => t.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
  const where = name ? `<div class="where">${esc(name)}</div>` : "";
  const map = addr
    ? `<a class="addr" href="https://maps.google.com/?q=${encodeURIComponent(addr)}" target="_blank" rel="noopener">${esc(addr)}</a>`
    : "";
  return `<div class="place">${where}${map}</div>`;
}

// The host's note to the group. Plain text, escaped, line breaks preserved, because
// people type lists into these and expect them to stay lists.
function noteBlock() {
  const n = (poll.notes || "").trim();
  if (!n) return "";
  const esc = n.replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
  return `<div class="note"><div class="note-label">From your host</div><div class="note-body">${esc}</div></div>`;
}

const RSVP_WORDS = { in: "I'm in", maybe: "Maybe", out: "Can't make it" };

/** That roster player's answer, if they have already given one. */
function existingRsvpFor(pid) {
  if (!pid) return null;
  return responses.find(r => r.player_id === pid && r.rsvp_status) || null;
}

/** What is in the note box: what they have typed, else what they said before. */
function noteValue(already) {
  if (typedNote !== null) return typedNote;
  return (already && already.rsvp_note) || "";
}

function currentNote() {
  const el = document.getElementById("rsvpnote");
  return el ? el.value.trim() : "";
}

function rsvpLine(label, list) {
  if (!list.length) return "";
  const names = list.map(r => esc(r.respondent_name)).join(", ");
  // Notes hang underneath rather than inline, so a long one cannot wreck the
  // shape of the list.
  const notes = list.filter(r => (r.rsvp_note || "").trim())
    .map(r => `<p class="rsvp-note"><strong>${esc(r.respondent_name)}</strong> ${esc(r.rsvp_note)}</p>`)
    .join("");
  return `<p style="margin:0 0 8px;font-size:14.5px"><strong>${label}</strong>: ${names}</p>${notes}`;
}

// Once a date is locked the poll link stops asking which nights work and starts
// asking whether you're coming. Same link, same name, same edit token.
function renderRsvp() {
  const chosen = options.find(o => o.id === poll.chosen_option_id);
  if (!chosen) return fail("This poll has closed.", "The host picked a date. Check your messages for the details.");

  const mine = myResponse();
  if (rsvpPick === null && mine) rsvpPick = mine.rsvp_status || null;
  const name = typedName !== null ? typedName : ((mine && mine.respondent_name) || localStorage.getItem(nameKey) || "");
  const seeded = mine && mine.rsvp_status;

  const d = new Date(chosen.starts_at);
  const going  = responses.filter(r => r.rsvp_status === "in");
  const maybes = responses.filter(r => r.rsvp_status === "maybe");
  const outs   = responses.filter(r => r.rsvp_status === "out");
  const lists  = rsvpLine("In", going) + rsvpLine("Maybe", maybes) + rsvpLine("Can't make it", outs);

  // Has the person whose name is currently tapped already answered?
  const already = existingRsvpFor(playerId);

  app.innerHTML = `
    <h1>Game ${dayWord(d)} is set</h1>
    <p class="sub">${already && !changing
      ? "You're all set. Nothing to do unless something changes."
      : seeded
        ? "We've pencilled you in from the dates you gave. Change it any time."
        : "Let the host know whether you can make it."}</p>

    <div class="opt picked" style="margin-top:22px">
      <div class="day">${fmtDay(d)}</div>
      <div class="time">${fmtTime(d)}</div>
      ${placeBlock()}
    </div>

    ${noteBlock()}

    <div class="card">
      <label class="fieldlab">WHO'S COMING</label>
      ${lists || `<p class="note" style="text-align:left;margin:0">Nobody has answered yet.</p>`}
    </div>

    ${loggedDeviceCard()}

    ${whoCard()}

    ${justSaved ? `
      <div class="flash">
        <span class="flash-tick">✓</span>
        <span>${justSaved === "confirmed" ? "Thanks for confirming. The host can see it."
              : justSaved === "changed" ? "Answer changed. The host can see it."
              : "Thanks. The host can see it."}</span>
      </div>
    ` : ""}

    ${already && !changing ? `
      <div class="card settled">
        <p class="settled-line">${already.rsvp_confirmed_at
          ? `<strong>Confirmed.</strong> You're down as <strong>${esc(RSVP_WORDS[already.rsvp_status])}</strong>.`
          : `You're down as <strong>${esc(RSVP_WORDS[already.rsvp_status])}</strong>.`}</p>
        ${already.rsvp_note ? `<p class="settled-sub">Your note: ${esc(already.rsvp_note)}</p>` : ""}
        ${already.rsvp_confirmed_at ? `
          <p class="settled-sub">Nothing else to do. Change it any time if your plans move.</p>
          <button class="send" id="changeMine" style="background:#8A8F79;margin-top:14px">Change my answer</button>
        ` : `
          <p class="settled-sub">That came from the nights you said you could do, before the date was picked. A quick confirm lets the host know you've seen it.</p>
          <button class="send" id="confirmMine" style="margin-top:14px">Confirm ${esc(RSVP_WORDS[already.rsvp_status])}</button>
          <button class="send" id="changeMine" style="background:#8A8F79;margin-top:10px">Change my answer</button>
        `}
        <button class="send" id="logAnother" style="background:#fff;color:var(--teal);border:1.5px solid var(--line);margin-top:10px">Log another response from this device</button>
      </div>
    ` : `
      <div class="card">
        <div class="choices" style="margin-top:2px">
          <button class="yes"   data-rsvp="in"    aria-pressed="${rsvpPick === "in"}">I'm in</button>
          <button class="maybe" data-rsvp="maybe" aria-pressed="${rsvpPick === "maybe"}">Maybe</button>
          <button class="no"    data-rsvp="out"   aria-pressed="${rsvpPick === "out"}">Can't make it</button>
        </div>
        <input type="text" id="rsvpnote" maxlength="200" enterkeyhint="done"
               placeholder="Anything to add? (optional)"
               value="${esc(noteValue(already))}" style="margin-top:12px">
      </div>

      <button class="send" id="send">${
        !already ? "Send my RSVP"
          : rsvpPick === already.rsvp_status ? "Confirm my RSVP"
          : "Change my RSVP"
      }</button>
      <p class="note">You can reopen this link any time to change your answer, or log another person's from this device.</p>
    `}
    <div id="err"></div>`;

  rerender = renderRsvp;
  wireWho();
  wireSavedChooser();
  document.querySelectorAll("[data-rsvp]").forEach(btn => {
    btn.onclick = () => {
      const nmEl = document.getElementById("nm");
      if (nmEl) typedName = nmEl.value;
      const noteEl = document.getElementById("rsvpnote");
      if (noteEl) typedNote = noteEl.value;
      rsvpPick = rsvpPick === btn.dataset.rsvp ? null : btn.dataset.rsvp;
      justSaved = null;
      renderRsvp();
    };
  });
  // Either the answer buttons are on the page or the "already down as" card is,
  // never both, so both handlers are optional.
  const sendBtn = document.getElementById("send");
  if (sendBtn) sendBtn.onclick = submitRsvp;
  const changeBtn = document.getElementById("changeMine");
  if (changeBtn) changeBtn.onclick = () => { changing = true; justSaved = null; renderRsvp(); };
  const confirmBtn = document.getElementById("confirmMine");
  if (confirmBtn) confirmBtn.onclick = () => {
    rsvpPick = already.rsvp_status;
    submitRsvp();
  };
  const logAnother = document.getElementById("logAnother");
  if (logAnother) logAnother.onclick = () => { clearForm(); renderRsvp(); };
}

async function submitRsvp() {
  const nm = currentName();
  const priorForMe = existingRsvpFor(playerId);
  const outcome = !priorForMe
    ? "sent"
    : priorForMe.rsvp_status === rsvpPick
      ? "confirmed"
      : "changed";
  const err = document.getElementById("err");
  err.innerHTML = "";
  if (!nm) {
    err.innerHTML = `<div class="err">${roster.length ? "Tap your name so the host knows who this is." : "Please add your name so the host knows who this is."}</div>`;
    const el = document.getElementById("nm");
    if (el && el.style.display !== "none") el.focus();
    return;
  }
  if (!rsvpPick) {
    err.innerHTML = `<div class="err">Pick one so the host knows where you stand.</div>`;
    return;
  }

  // The submitting button is #send in the normal flow and #confirmMine on the
  // already-answered card, and only one of them is ever on the page. This used
  // to assume #send, so confirming threw a TypeError before the try block and
  // failed silently: no request, no error, nothing.
  const btn = document.getElementById("send") || document.getElementById("confirmMine");
  const btnLabel = btn ? btn.textContent : "";
  if (btn) {
    btn.disabled = true;
    btn.textContent = "Sending…";
  }
  localStorage.setItem(nameKey, nm);

  // Only use a token this browser actually holds for the response currently
  // loaded. A stale or borrowed token here is exactly how one name's answer
  // used to overwrite another's.
  const activeEntry = activeSavedId ? savedResponses.find(s => s.id === activeSavedId) : null;
  const token = activeEntry ? activeEntry.token : null;

  try {
    const res = await fetchWithRetry(SUPA_URL + "/rest/v1/rpc/poll_rsvp", {
      method: "POST",
      headers: H,
      body: JSON.stringify({
        p_poll_id: pollId,
        p_name: nm,
        p_token: token,
        p_status: rsvpPick,
        p_note: currentNote(),
      }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || body.hint || "Something went wrong.");

    await loadResponses();
    const mine = responses.find(r => r.respondent_name === nm);
    if (playerId) {
      try { await rpc("poll_set_player", { p_poll_id: pollId, p_token: body, p_player_id: playerId }); } catch (e) {}
    }
    const savedId = mine ? mine.id : (activeEntry ? activeEntry.id : "");
    savedResponses = addOrUpdateSaved(savedId, body, nm);
    activeSavedId = savedId || activeSavedId;
    typedName = null;
    justSaved = outcome;
    // Back to the settled card. Without this, somebody who tapped "Change my
    // answer" and submitted was left looking at the choice buttons again, which
    // reads like the change never took.
    changing = false;
    renderRsvp();
  } catch (e) {
    if (btn) {
      btn.disabled = false;
      // Put back whatever it said, rather than assuming "Send my RSVP".
      btn.textContent = btnLabel;
    }
    err.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

/**
 * One dropped request should not cost somebody their answer.
 *
 * A submit is a single fetch with no timeout and no retry, so on a marginal
 * connection (two bars, opened from a Messages in-app browser) it can fail
 * before it ever reaches the server. That looked like "Load failed" and the
 * answer was simply lost.
 *
 * Retries only when the fetch itself rejects. An HTTP response, including a 400,
 * is a real answer from the server and is returned as-is: re-sending it could
 * duplicate a submission.
 */
async function fetchWithRetry(url, opts, tries = 3) {
  let lastErr;
  for (let i = 0; i < tries; i++) {
    try {
      return await fetch(url, opts);
    } catch (e) {
      lastErr = e;
      if (i < tries - 1) await new Promise(r => setTimeout(r, 600 * (i + 1)));
    }
  }
  throw lastErr;
}

async function submit() {
  const nm = currentName();
  const err = document.getElementById("err");
  err.innerHTML = "";
  if (!nm) {
    err.innerHTML = `<div class="err">${roster.length ? "Tap your name so the host knows who this is." : "Please add your name so the host knows who this is."}</div>`;
    const el = document.getElementById("nm");
    if (el && el.style.display !== "none") el.focus();
    return;
  }
  // The submitting button is #send in the normal flow and #confirmMine on the
  // already-answered card, and only one of them is ever on the page. This used
  // to assume #send, so confirming threw a TypeError before the try block and
  // failed silently: no request, no error, nothing.
  const btn = document.getElementById("send") || document.getElementById("confirmMine");
  const btnLabel = btn ? btn.textContent : "";
  if (btn) {
    btn.disabled = true;
    btn.textContent = "Sending…";
  }
  localStorage.setItem(nameKey, nm);

  const answers = Object.entries(picks)
    .filter(([, c]) => c === "yes" || c === "if_needed")
    .map(([option_id, choice]) => ({ option_id, choice }));

  // Only use a token this browser actually holds for the response currently
  // loaded. A stale or borrowed token here is exactly how one name's answer
  // used to overwrite another's.
  const activeEntry = activeSavedId ? savedResponses.find(s => s.id === activeSavedId) : null;
  const token = activeEntry ? activeEntry.token : null;

  try {
    const res = await fetchWithRetry(SUPA_URL + "/rest/v1/rpc/poll_submit", {
      method: "POST",
      headers: H,
      body: JSON.stringify({ p_poll_id: pollId, p_name: nm, p_token: token, p_answers: answers }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.message || body.hint || "Something went wrong.");

    await loadResponses();
    const mine = responses.find(r => r.respondent_name === nm);
    if (playerId) {
      try { await rpc("poll_set_player", { p_poll_id: pollId, p_token: body, p_player_id: playerId }); } catch (e) {}
    }
    const savedId = mine ? mine.id : (activeEntry ? activeEntry.id : "");
    savedResponses = addOrUpdateSaved(savedId, body, nm);
    activeSavedId = savedId || activeSavedId;
    renderResults(false);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Send my dates";

    // Two failures used to surface as raw browser strings, and "Load failed" is
    // Safari's wording for a fetch that never completed. Neither told anyone
    // what to do next.
    let msg = e.message || String(e);
    const networkish = /load failed|failed to fetch|network|timed out/i.test(msg);

    // The page holds a snapshot from whenever it was opened. If the host locked
    // in a date in the meantime, this poll is closed and dates cannot be sent,
    // which is not something a retry will fix. Check before blaming the signal.
    let nowClosed = false;
    try {
      const chk = await fetch(
        `${SUPA_URL}/rest/v1/polls?id=eq.${pollId}&select=status`,
        { headers: H }
      );
      if (chk.ok) {
        const rows = await chk.json();
        nowClosed = rows && rows[0] && rows[0].status === "closed";
      }
    } catch (_) {}

    if (nowClosed) {
      err.innerHTML = `<div class="err">The host has already picked the date, so dates
        are closed for this one. Reloading so you can say whether you can make it.</div>`;
      setTimeout(() => location.reload(), 2200);
      return;
    }

    if (networkish) {
      msg = "Couldn't reach the server after a few tries, so nothing was sent. Check your connection and tap Send my dates again.";
    }
    err.innerHTML = `<div class="err">${esc(msg)}</div>`;
  }
}

load();
</script>
